version: "3.9"

services:
  costrace:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: costrace-api
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - ./GeoLite2-City.mmdb:/costrace/GeoLite2-City.mmdb:ro
    env_file:
      - ../.env
    environment:
      - ENV=production
      - PORT=8081
    networks:
      - costrace-network

networks:
  costrace-network:
    driver: bridge
