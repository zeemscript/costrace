[project]
name = "costrace-sdk"
version = "0.1.1"
description = "Costrace python SDK for tracking cost, token usage, and latency of LLM API calls. Works by monkey-patching supported LLM client libraries so existing code requires no changes."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.32.5",
]

[project.optional-dependencies]
openai = ["openai>=2.21.0"]
anthropic = ["anthropic>=0.82.0"]
gemini = ["google-genai>=1.64.0"]
all = ["openai>=2.21.0", "anthropic>=0.82.0", "google-genai>=1.64.0"]

[tool.uv.workspace]
members = [
    "costrace",
]
